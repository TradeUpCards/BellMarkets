<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BellMarkets — Compare Landings</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #fafaf7; color: #1a1a1a;
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: auto;
  }
  .topbar {
    background: #ffffff; border-bottom: 1px solid #e0e0dd;
    padding: 14px 24px;
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 100;
  }
  .topbar h1 { font-size: 18px; font-weight: 700; }
  .topbar .meta { color: #6a6a6a; font-size: 13px; }
  .topbar .meta code { background: #f0f0ed; padding: 2px 6px; border-radius: 3px; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  .nav-links { display: flex; gap: 12px; }
  .nav-link {
    padding: 8px 14px; background: #ffffff; border: 1px solid #c0c0bd;
    color: #1a1a1a; border-radius: 6px; text-decoration: none;
    font-size: 13px; font-weight: 600;
  }
  .nav-link.primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

  .grid {
    display: grid; grid-template-columns: repeat(5, 1fr);
    gap: 12px; padding: 16px;
    min-width: 2000px;
  }
  .col { display: flex; flex-direction: column; }
  .col-header {
    background: #ffffff; border: 1px solid #e0e0dd;
    border-radius: 8px 8px 0 0; padding: 12px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .col-name {
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    font-weight: 700; letter-spacing: 0.5px;
  }
  .col-name .num { color: #6A4FB3; }
  .col-actions { display: flex; gap: 4px; }
  .col-actions a {
    padding: 4px 10px; background: #f5f5f2; color: #1a1a1a;
    border-radius: 4px; text-decoration: none; font-size: 11px;
    font-weight: 600;
  }
  .col-actions a:hover { background: #e8e8e3; }
  .col-actions a.full { background: #1a1a1a; color: #fff; }

  .frame-wrap {
    background: #fff; border: 1px solid #e0e0dd; border-top: none;
    border-radius: 0 0 8px 8px;
    overflow: hidden;
    height: calc(100vh - 140px); min-height: 700px;
  }
  iframe {
    border: none;
    width: 100%; height: 100%;
    transform-origin: 0 0;
  }

  /* Scale iframes down to fit narrow columns */
  .scale iframe {
    width: 250%; height: 250%;
    transform: scale(0.4);
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>BellMarkets · Compare Landings <span class="meta">— scroll horizontally · zoom out for full view</span></h1>
  <div class="nav-links">
    <a href="index.html" class="nav-link">← All candidates</a>
    <a href="compare-trade.html" class="nav-link primary">Compare trade pages →</a>
  </div>
</div>

<div class="grid">

  <div class="col">
    <div class="col-header">
      <div class="col-name"><span class="num">v1</span> Hyperliquid</div>
      <div class="col-actions">
        <a href="v1-landing.html" target="_blank" class="full">↗ open</a>
      </div>
    </div>
    <div class="frame-wrap scale">
      <iframe src="v1-landing.html"></iframe>
    </div>
  </div>

  <div class="col">
    <div class="col-header">
      <div class="col-name"><span class="num">v2</span> Polymarket</div>
      <div class="col-actions">
        <a href="v2-landing.html" target="_blank" class="full">↗ open</a>
      </div>
    </div>
    <div class="frame-wrap scale">
      <iframe src="v2-landing.html"></iframe>
    </div>
  </div>

  <div class="col">
    <div class="col-header">
      <div class="col-name"><span class="num">v3</span> Drift</div>
      <div class="col-actions">
        <a href="v3-landing.html" target="_blank" class="full">↗ open</a>
      </div>
    </div>
    <div class="frame-wrap scale">
      <iframe src="v3-landing.html"></iframe>
    </div>
  </div>

  <div class="col">
    <div class="col-header">
      <div class="col-name"><span class="num">v4</span> Bloomberg</div>
      <div class="col-actions">
        <a href="v4-landing.html" target="_blank" class="full">↗ open</a>
      </div>
    </div>
    <div class="frame-wrap scale">
      <iframe src="v4-landing.html"></iframe>
    </div>
  </div>

  <div class="col">
    <div class="col-header">
      <div class="col-name"><span class="num">v5</span> Linear</div>
      <div class="col-actions">
        <a href="v5-landing.html" target="_blank" class="full">↗ open</a>
      </div>
    </div>
    <div class="frame-wrap scale">
      <iframe src="v5-landing.html"></iframe>
    </div>
  </div>

</div>

</body>
</html>
