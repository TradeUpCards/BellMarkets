[toolchain]
anchor_version = "0.31.1"
solana_version = "3.1.14"

[features]
resolution = true
skip-lint = false

[programs.localnet]
bell_markets = "599h7VznYR4CxyrG5nQbhR13qtRuwPcbnNr5QqbkS7uV"

[programs.devnet]
bell_markets = "599h7VznYR4CxyrG5nQbhR13qtRuwPcbnNr5QqbkS7uV"

# Mainnet intentionally omitted — Hard NO #1 (no mainnet, no real funds).
# See .project/bell-markets/kickoff/aria.md and CLAUDE_SESSION_HANDOFF.md "Hard Rules".

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Devnet"
# Per w3swap solana_token_migration pattern: the upgrade authority keypair
# (gitignored under keys/) signs `anchor deploy` and program upgrades. Devnet
# only — mainnet keypair never created (Hard NO #1).
wallet = "keys/devnet-upgrade-authority.json"

[scripts]
test = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 'tests/contracts/**/*.ts'"
